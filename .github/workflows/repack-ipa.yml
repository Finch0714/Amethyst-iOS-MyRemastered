name: Repack Camera IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repack-ipa.yml'

permissions:
  contents: write
  actions: read

jobs:
  repack:
    runs-on: macos-15
    steps:
      - name: Download built IPA artifact
        uses: actions/download-artifact@v4
        with:
          pattern: 'com.air-devs.air-ios*'
          path: artifacts
          run-id: 42454360593
          repository: Finch0714/Amethyst-iOS-MyRemastered
          github-token: ${{ github.token }}

      - name: Repack full and slim IPA with ditto
        run: |
          set -euo pipefail
          SRC=$(find artifacts -type f -name '*.ipa' | head -1)
          echo "src=$SRC size=$(stat -f%z "$SRC")"
          rm -rf work slim out
          mkdir -p work out
          ditto -x -k "$SRC" work
          APP=$(find work/Payload -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          test -f "$APP/Frameworks/libcamera_capture.dylib"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist"

          ditto -c -k --norsrc --noextattr --keepParent work/Payload "out/Air-6.0.0-camera-full.ipa"

          mkdir -p slim
          cp -R work/Payload slim/Payload
          SAPP=$(find slim/Payload -maxdepth 1 -name '*.app' -type d | head -1)
          rm -rf "$SAPP/java_runtimes/java-17-openjdk" "$SAPP/java_runtimes/java-25-openjdk"
          ls "$SAPP/java_runtimes"
          ditto -c -k --norsrc --noextattr --keepParent slim/Payload "out/Air-6.0.0-camera-slim.ipa"

          for f in out/*.ipa; do
            echo "== $f size=$(stat -f%z "$f")"
            unzip -l "$f" | head -4
            if unzip -l "$f" | grep -q '__MACOSX'; then echo 'ERROR: __MACOSX present'; exit 1; fi
            unzip -l "$f" | grep -q 'Payload/AngelAuraAmethyst.app/Info.plist' || { echo 'ERROR: missing Info.plist'; exit 1; }
          done

          cd out
          shasum -a 256 *.ipa | tee SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag=camera-bg-1.0.1-ios
          gh release delete "$tag" --repo Finch0714/Amethyst-iOS-MyRemastered --yes --cleanup-tag || true
          gh release create "$tag" out/*.ipa out/SHA256SUMS.txt \
            --repo Finch0714/Amethyst-iOS-MyRemastered \
            --title "Camera Background iOS (repacked, same bundle id)" \
            --notes "Repacked from the verified 6.0.0 build. Same bundle id com.air-devs.air, install over the existing app to keep instances and saves. full = identical content, ditto repack; slim = java-17/java-25 runtimes removed (java-8 + java-21 kept, enough for 1.21.1)."
